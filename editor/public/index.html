<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Site Editor — caroline chou</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/__editor__/editor-shell.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>Site Editor</h1>
        <p>Drag photos, upload images, edit text — then Save.</p>
      </div>
      <nav id="page-list" class="page-list"></nav>
      <div class="sidebar-footer">
        <button id="new-page-btn" class="btn btn-ghost btn-block">+ New Page</button>
        <button id="edit-menu-btn" class="btn btn-ghost btn-block">Edit Menu</button>
        <a href="/index.html" target="_blank">View live site &rarr;</a>
      </div>
    </aside>
    <main class="workspace">
      <div class="insert-toolbar">
        <span class="insert-toolbar-label">Insert:</span>
        <button id="insert-textbox-btn" class="btn btn-ghost" disabled>+ Text</button>
        <button id="insert-image-btn" class="btn btn-ghost" disabled>+ Image</button>
        <button id="insert-mailing-btn" class="btn btn-ghost" disabled>+ Mailing List</button>
      </div>
      <div class="topbar">
        <span id="current-page-label">Select a page to edit</span>
        <div class="topbar-actions">
          <button id="viewport-desktop-btn" class="btn btn-ghost btn-toggle active" title="Desktop view">Desktop</button>
          <button id="viewport-phone-btn" class="btn btn-ghost btn-toggle" title="Phone view">Phone</button>
          <span id="dirty-indicator" class="dirty-indicator"></span>
          <button id="reload-btn" class="btn btn-ghost" disabled>Discard changes</button>
          <button id="save-btn" class="btn btn-primary" disabled>Save</button>
        </div>
      </div>
      <div class="canvas">
        <div id="frame-wrap" class="frame-wrap">
          <iframe id="page-frame" title="Page preview"></iframe>
        </div>
        <div id="empty-state" class="empty-state">
          <p>Pick a page from the left to start editing.</p>
        </div>
      </div>
    </main>
  </div>

  <div id="nav-modal" class="modal-overlay" style="display:none">
    <div class="modal">
      <h2>Edit Menu</h2>
      <p class="modal-hint">Edits apply to the header menu on every page. Reorder with the arrows.</p>
      <div id="nav-items-list" class="nav-items-list"></div>
      <div class="modal-add-row">
        <button id="nav-add-link-btn" class="btn btn-ghost">+ Add Link</button>
        <button id="nav-add-dropdown-btn" class="btn btn-ghost">+ Add Dropdown Menu</button>
      </div>
      <div class="modal-actions">
        <button id="nav-cancel-btn" class="btn btn-ghost">Cancel</button>
        <button id="nav-save-btn" class="btn btn-primary">Save Menu</button>
      </div>
    </div>
  </div>

  <script src="/__editor__/editor-shell.js"></script>
</body>
</html>
